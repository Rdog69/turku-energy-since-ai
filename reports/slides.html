<h2 id="slide-1-title--executive-summary">Slide 1: Title &amp; Executive Summary</h2>
<h3 id="operational-10-hour-imbalance-price-forecasting--situation-room">Operational 10-Hour Imbalance Price Forecasting &amp; Situation Room</h3>
<ul>
<li data-marpit-fragment="1"><strong>Challenge:</strong> Forecast Finnish 15-minute imbalance prices 1–40 steps (10h ahead), balancing direction, and tail spike risk.</li>
<li data-marpit-fragment="2"><strong>Core Philosophy:</strong> Predict <strong>deviations from spot</strong> driven by physical grid fundamentals, not black-box price guessing.</li>
<li data-marpit-fragment="3"><strong>Key Achievements:</strong>
<ul>
<li data-marpit-fragment="4"><strong>38.1% MAE Error Reduction</strong> vs. official baseline (40.97 vs. 66.20 €/MWh).</li>
<li data-marpit-fragment="5"><strong>52.0% Calibration Loss Reduction</strong> (Pinball: 11.61 vs. 24.18, 80.1% coverage).</li>
<li data-marpit-fragment="6"><strong>24.0% Spike Brier Reduction</strong> (0.0860 vs. 0.1132, with zero-parameter Kolmogorov direction envelope).</li>
<li data-marpit-fragment="7"><strong>Anti-Overfit Equal-Weight Architecture:</strong> Wins <strong>9 out of 10 individual weeks</strong> across both August (+6.81) and September (+6.35).</li>
<li data-marpit-fragment="8"><strong>Validated Official Submission:</strong> 26,920 rows verified with zero errors, 100% TreeSHAP physical drivers.</li>
<li data-marpit-fragment="9"><strong>Operational Situation Room:</strong> Interactive UI with time travel, consensus monitoring, primary action window, and actuals audit.</li>
</ul>
</li>
</ul>
</section>

<ul>

</ul>
